name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pnpm modules and build
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Apache's Actions policy permits only approved actions.  Install pnpm
      # through Node's bundled Corepack instead of pnpm/action-setup.
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install
      - name: Run scripts
        run: |
          node scripts/fetchPlugins.js
          node scripts/fetchStars.js
          node scripts/contributor.js

      - name: build
        run: pnpm run build

      # Keep publishing to the existing dist-pages branch without a third-party
      # action, which is blocked by Apache's Actions policy.
      - name: Publish site
        if: github.event_name != 'pull_request'
        run: |
          publish_dir="$(mktemp -d)"
          git worktree add --detach "$publish_dir" origin/dist-pages
          rsync -a --delete build/ "$publish_dir/"
          cd "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:dist-pages
